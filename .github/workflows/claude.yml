# Lets Keerthika ask Claude for portfolio changes from a GitHub issue or pull request.
# Write "@claude ..." in an issue, a comment, or a pull-request review.
# Only people with write access to this repo can trigger it.
name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these repo secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, Pro/Max plan)
          # or ANTHROPIC_API_KEY (from console.anthropic.com, pay per use).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(curl:*),Bash(ls:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(mkdir:*),Bash(grep:*),Bash(LC_ALL=C grep:*),Edit,Write,Read,Glob,Grep"
            --append-system-prompt "You are updating Keerthika Mohanmoorthy's ECE portfolio website. Follow CLAUDE.md exactly, especially the section 'Working from GitHub (Claude GitHub Action)'. Always run 'node tools/sync-layout.js' after changes. Explain what you changed in plain, friendly language for a non-technical reader, and remind her to check the preview link before merging."
